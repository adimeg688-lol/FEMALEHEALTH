<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>film</title>
<style>
  /* The stage is exactly the film's size, top-left, with no scrollbars: the capture photographs it as it is. */
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #bar { position: fixed; left: 12px; bottom: 10px; font: 13px ui-monospace, Menlo, monospace; color: #fff; opacity: 0.7; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="bar" hidden></div>
<script type="module" src="./film.js"></script>
<script type="module">
  // Opened by a person (no #capture): fit the stage to the window and play it with its sound.
  // Space pauses, the arrows step a frame. The capture never runs this.
  if (location.hash !== "#capture") {
    const stage = document.getElementById("stage"), bar = document.getElementById("bar");
    const wait = setInterval(async () => {
      if (!window.film) return;
      clearInterval(wait);
      const f = window.film;
      await f.ready;
      const fit = () => { const k = Math.min(innerWidth / f.width, innerHeight / f.height); stage.style.transform = `scale(${k})`; stage.style.left = `${(innerWidth - f.width * k) / 2}px`; };
      fit(); addEventListener("resize", fit);
      bar.hidden = false;
      const audio = new Audio("audio/mix.wav");
      let t = 0, playing = true, last = performance.now();
      audio.play().catch(() => {});
      addEventListener("keydown", (e) => {
        if (e.key === " ") { playing = !playing; playing ? audio.play().catch(() => {}) : audio.pause(); last = performance.now(); }
        if (e.key === "ArrowRight") { playing = false; audio.pause(); t = Math.min(f.duration, t + 1 / f.fps); }
        if (e.key === "ArrowLeft") { playing = false; audio.pause(); t = Math.max(0, t - 1 / f.fps); }
      });
      const tick = (now) => {
        if (playing) { t += (now - last) / 1000; if (t >= f.duration) { t = 0; audio.currentTime = 0; } }
        last = now;
        f.seek(t);
        bar.textContent = `${t.toFixed(2)} / ${f.duration} s · frame ${Math.floor(t * f.fps)} · space pauses`;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }, 30);
  }
</script>
</body>
</html>
